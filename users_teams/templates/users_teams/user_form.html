{% extends "core/layouts/form.html" %}
{% load static %}

{% block extra_css %}<link rel="stylesheet" href="{% static 'users_teams/css/users_teams.css' %}">{% endblock %}

{% block form_actions %}
  <button type="submit" class="btn btn-primary">Enregistrer</button>
  {% if managed_user %}
    <a class="btn btn-secondary" href="{% url 'users_teams:user_detail' managed_user.pk %}">Annuler</a>
  {% else %}
    <a class="btn btn-secondary" href="{% url 'users_teams:user_list' %}">Retour à la liste</a>
  {% endif %}
{% endblock %}
