{% extends "core/base.html" %}

{% block content %}
<section class="page-card page-card--narrow">
  <p class="eyebrow">Action irréversible</p><h1>Supprimer ce point d’accès ?</h1>
  <p class="page-intro">Vous êtes sur le point de supprimer <strong>{{ access_point.name }}</strong>.</p>
  <form class="form-actions" method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Oui, supprimer</button><a class="btn btn-secondary" href="{% url 'registration_access:entity_list' 'access-points' %}">Annuler</a></form>
</section>
{% endblock %}
