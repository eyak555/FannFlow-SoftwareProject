<div class="field{% if field.errors %} field--error{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="press-required" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.errors %}
    <ul class="press-field-errors" id="{{ field.auto_id }}_errors">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% elif field.help_text %}
    <p class="hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>
  {% endif %}
</div>
